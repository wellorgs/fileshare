<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#8a8a8e;
  --blue:#007aff; --red:#ff3b30; --border:#e5e5ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --sub:#8a8a8e; --border:#2c2c2e; }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:24px 16px 60px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin:8px 0 2px;text-align:center}
.tagline{color:var(--sub);font-size:13px;text-align:center;margin:0 0 24px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--sub);
  text-transform:uppercase;letter-spacing:.4px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
input[type=text]{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  font-size:16px;background:transparent;color:var(--text);outline:none;
}
input[type=text]:focus{border-color:var(--blue)}
.btn{
  width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;
  cursor:pointer;margin-top:10px;transition:opacity .15s;
}
.btn:active{opacity:.7}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-danger{background:transparent;color:var(--red)}
.row{display:flex;gap:10px}
.row input{flex:1}
.code{font-size:36px;font-weight:700;letter-spacing:6px;text-align:center;
  padding:16px 0;color:var(--blue)}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.dot.live{background:#34c759}
.dot.pending{background:#ff9500}
.dot.err{background:var(--red)}
#drop{
  border:2px dashed var(--border);border-radius:14px;padding:36px 16px;text-align:center;
  color:var(--sub);font-size:14px;margin-bottom:10px;transition:.15s;
}
#drop.over{border-color:var(--blue);background:rgba(0,122,255,.06)}
.filerow{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.filerow:last-child{border-bottom:none}
.filerow .name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .name a{color:var(--text);text-decoration:none}
.filerow .size{font-size:12px;color:var(--sub);flex:none}
.filerow button{
  flex:none;border:none;background:none;color:var(--red);font-size:13px;
  cursor:pointer;padding:4px 6px;
}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:8px 0}
.hidden{display:none !important}
.section-title{font-size:13px;font-weight:600;color:var(--sub);
  text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px}
</style></head>
<body>
<div class="wrap">
  <h1>Share</h1>
  <p class="tagline">Direct device-to-device. Nothing touches a server.</p>

  <div class="card">
    <h3>Your name</h3>
    <input type="text" id="myName" placeholder="e.g. Akhil's laptop" maxlength="30">
  </div>

  <div class="card" id="connectCard">
    <div class="status"><span class="dot" id="dot"></span><span id="status">not connected</span></div>
  </div>

  <div class="card" id="createStep">
    <h3>Start a room</h3>
    <button class="btn btn-primary" onclick="createRoom()">Create room</button>
    <div id="codeBox" class="hidden">
      <div class="code" id="roomCode"></div>
      <label style="text-align:center">share this code with the other device</label>
    </div>
  </div>

  <div class="card" id="joinStep">
    <h3>Join a room</h3>
    <div class="row">
      <input type="text" id="joinCode" placeholder="123456" maxlength="6" inputmode="numeric">
      <button class="btn btn-primary" style="width:auto;flex:none;padding:13px 20px" onclick="joinRoom()">Connect</button>
    </div>
  </div>

  <div id="transfer" class="hidden">
    <div class="card">
      <h3>Send</h3>
      <div id="drop">Drag files here, or</div>
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">+ Add file</button>
      <input type="file" id="fileInput" multiple class="hidden">
    </div>
    <div class="card">
      <h3>Received</h3>
      <div id="list"><div class="empty">nothing yet</div></div>
    </div>
  </div>
</div>

<script>
let peer, conn, peerName = null;
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
const nameInput = document.getElementById('myName');
nameInput.value = localStorage.getItem('shareName') || '';
nameInput.addEventListener('input', () => localStorage.setItem('shareName', nameInput.value));

function myName() { return nameInput.value.trim() || 'a device'; }
function setStatus(s, dotClass) {
  statusEl.textContent = s;
  dotEl.className = 'dot' + (dotClass ? ' ' + dotClass : '');
}

const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function randomCode() { return String(Math.floor(100000 + Math.random() * 900000)); }

function createRoom() {
  const code = randomCode();
  setStatus('opening room ' + code + '...', 'pending');
  peer = new Peer(code, { config: ICE_CONFIG });
  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('codeBox').classList.remove('hidden');
    setStatus('waiting for someone to join...', 'pending');
  });
  peer.on('connection', c => { conn = c; setupConnection(); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { createRoom(); return; }
    setStatus('error: ' + err.type, 'err');
    alert('Connection setup failed: ' + err.type);
  });
}

function joinRoom() {
  const code = document.getElementById('joinCode').value.trim();
  if (!/^\d{4,6}$/.test(code)) { alert('enter the 4-6 digit code'); return; }
  setStatus('connecting to room ' + code + '...', 'pending');
  peer = new Peer({ config: ICE_CONFIG });
  peer.on('open', () => {
    conn = peer.connect(code, { reliable: true, metadata: { name: myName() } });
    setupConnection();
  });
  peer.on('error', err => {
    setStatus('error: ' + err.type, 'err');
    alert('Could not connect: ' + err.type + (err.type === 'peer-unavailable' ? ' — check the code' : ''));
  });
}

function setupConnection() {
  setStatus('negotiating...', 'pending');
  conn.on('open', () => {
    conn.send({ type: 'hello', name: myName() });
    if (conn.metadata && conn.metadata.name) peerName = conn.metadata.name;
    setStatus('connected' + (peerName ? ' to ' + peerName : ''), 'live');
    document.getElementById('createStep').classList.add('hidden');
    document.getElementById('joinStep').classList.add('hidden');
    document.getElementById('transfer').classList.remove('hidden');
  });
  conn.on('close', () => setStatus('disconnected', 'err'));
  conn.on('error', err => { setStatus('connection error', 'err'); alert('Connection error: ' + err); });

  let incoming = null;
  conn.on('data', async (data) => {
    if (data && data.type === 'hello') {
      peerName = data.name;
      setStatus('connected to ' + peerName, 'live');
    } else if (data && data.type === 'file-start') {
      incoming = { name: data.name, size: data.size, writer: null, chunks: [] };
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({ suggestedName: data.name });
          incoming.writer = await handle.createWritable();
        } catch (err) { incoming.writer = null; }
      }
    } else if (data && data.type === 'file-end' && incoming) {
      addReceivedRow(incoming);
      incoming = null;
    } else if (incoming && data instanceof ArrayBuffer) {
      if (incoming.writer) await incoming.writer.write(data);
      else incoming.chunks.push(data);
    }
  });
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function addReceivedRow(incoming) {
  const list = document.getElementById('list');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'filerow';

  if (incoming.writer) {
    row.innerHTML = `<span class="name">${incoming.name}</span><span class="size">${fmtSize(incoming.size)}</span>`;
  } else {
    const blob = new Blob(incoming.chunks);
    const url = URL.createObjectURL(blob);
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    const a = document.createElement('a');
    a.href = url; a.download = incoming.name; a.textContent = incoming.name;
    nameSpan.appendChild(a);
    row.appendChild(nameSpan);
    const sizeSpan = document.createElement('span');
    sizeSpan.className = 'size'; sizeSpan.textContent = fmtSize(incoming.size);
    row.appendChild(sizeSpan);
    const discard = document.createElement('button');
    discard.textContent = 'Discard';
    discard.onclick = () => { URL.revokeObjectURL(url); row.remove(); showEmptyIfNeeded(); };
    row.appendChild(discard);
  }
  list.appendChild(row);
}

function showEmptyIfNeeded() {
  const list = document.getElementById('list');
  if (!list.children.length) list.innerHTML = '<div class="empty">nothing yet</div>';
}

const CHUNK = 16 * 1024;
async function sendFile(file) {
  conn.send({ type: 'file-start', name: file.name, size: file.size });
  const reader = file.stream().getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    for (let off = 0; off < value.byteLength; off += CHUNK) {
      const slice = value.slice(off, off + CHUNK).buffer;
      while ((conn.dataChannel?.bufferedAmount || 0) > 8 * 1024 * 1024) {
        await new Promise(r => setTimeout(r, 20));
      }
      conn.send(slice);
    }
  }
  conn.send({ type: 'file-end' });
}

async function sendFiles(fileList) {
  if (!conn || !conn.open) { alert('not connected yet'); return; }
  const drop = document.getElementById('drop');
  for (const file of fileList) {
    drop.textContent = 'sending ' + file.name + '...';
    try {
      await sendFile(file);
    } catch (err) {
      alert('send failed: ' + err.message);
      break;
    }
  }
  drop.textContent = 'Drag files here, or';
}

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => sendFiles(e.dataTransfer.files));

document.getElementById('fileInput').addEventListener('change', e => {
  sendFiles(e.target.files);
  e.target.value = '';
});
</script>
</body></html>
