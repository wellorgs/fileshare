<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f2f2f7; --panel:#ffffff; --card:#f7f7f9; --text:#1c1c1e; --sub:#8a8a8e;
  --blue:#007aff; --red:#ff3b30; --green:#34c759; --border:#e5e5ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --panel:#161618; --card:#1c1c1e; --text:#f2f2f7; --sub:#8a8a8e; --border:#2c2c2e; }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:19px;font-weight:700;margin:0}
.tagline{color:var(--sub);font-size:11px;margin:2px 0 0}
h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--sub);
  text-transform:uppercase;letter-spacing:.4px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
input[type=text]{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;
  font-size:15px;background:transparent;color:var(--text);outline:none;
}
input[type=text]:focus{border-color:var(--blue)}
.btn{
  padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;transition:opacity .15s;
}
.btn:active{opacity:.7}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-secondary{background:var(--border);color:var(--text)}
.row{display:flex;gap:8px}
.row input{flex:1}
.row .btn{flex:none;width:auto}
.code{font-size:26px;font-weight:700;letter-spacing:4px;text-align:center;
  padding:2px 0 8px;color:var(--blue)}
#qrbox{display:flex;justify-content:center;padding:6px 0 2px}
#qrbox img,#qrbox canvas{border-radius:8px;width:110px;height:110px}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sub);flex:none}
.dot.live{background:var(--green)}
.dot.pending{background:#ff9500}
.dot.err{background:var(--red)}
.hidden{display:none !important}

/* ---- app shell: sidebar / workspace / queue+history ---- */
.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar,.rightpanel{padding:16px;display:flex;flex-direction:column;gap:12px}
.sidebar{background:var(--panel);border-bottom:1px solid var(--border)}
.rightpanel{background:var(--panel);border-top:1px solid var(--border)}
.workspace{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.section{background:var(--card);border-radius:14px;padding:14px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}

.device-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.os-badge{font-size:9px;font-weight:700;color:var(--sub);border:1px solid var(--border);
  border-radius:4px;padding:1px 4px;flex:none}
.device-row .dot{background:var(--green);margin-left:auto}

#drop{
  border:2px dashed var(--border);border-radius:14px;padding:14px 16px;text-align:center;
  color:var(--sub);font-size:14px;transition:.15s;flex:1;display:flex;
  align-items:center;justify-content:center;min-height:120px;
}
#drop.over{border-color:var(--blue);background:rgba(0,122,255,.06)}
body.dragging{outline:3px dashed var(--blue);outline-offset:-3px}
.workspace-actions{display:flex;gap:10px}
.workspace-actions .btn{flex:1}

.tabs{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:3px}
.tab{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:13px;
  font-weight:600;color:var(--sub);cursor:pointer}
.tab.active{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tabpanel{flex:1;overflow-y:auto;min-height:0}

.filerow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.filerow:last-child{border-bottom:none}
.filerow .meta{flex:1;overflow:hidden}
.filerow .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .name a{color:var(--text);text-decoration:none}
.filerow .from{font-size:11px;color:var(--sub)}
.filerow .size{font-size:11px;color:var(--sub);flex:none}
.filerow .right{display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:2px}
.filerow .time{font-size:10px;color:var(--sub)}
.filerow button{flex:none;border:none;background:none;color:var(--red);font-size:12px;cursor:pointer;padding:4px 6px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:16px 0}
.badge{width:20px;height:20px;border-radius:50%;flex:none;color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.badge.in{background:var(--green)}
.badge.out{background:var(--blue)}

/* Desktop/laptop: three columns filling the viewport, no page-level
   scroll - each column scrolls internally if its content overflows. */
@media (min-width:900px){
  body{height:100vh;overflow:hidden}
  .app{flex-direction:row;height:100vh}
  .sidebar{width:280px;flex:none;border-bottom:none;border-right:1px solid var(--border);overflow-y:auto}
  .workspace{flex:1;min-width:0}
  .rightpanel{width:300px;flex:none;border-top:none;border-left:1px solid var(--border)}
}
</style></head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><h1>Share</h1><span class="tagline" id="versionTag"></span></div>
    <p class="tagline" style="margin-bottom:4px">Direct device-to-device. Nothing touches a server.</p>

    <div class="section">
      <h3>Your name</h3>
      <input type="text" id="myName" placeholder="e.g. Akhil's laptop" maxlength="30">
    </div>

    <div class="section">
      <div class="status"><span class="dot" id="dot"></span><span id="status">not connected</span></div>
    </div>

    <div class="section" id="createStep">
      <h3>Start a room</h3>
      <button class="btn btn-primary" onclick="createRoom()">Create room</button>
      <div id="codeBox" class="hidden">
        <div class="code" id="roomCode"></div>
        <div id="qrbox"></div>
        <label style="text-align:center">share the code, or scan the QR to join</label>
      </div>
    </div>

    <div class="section" id="joinStep">
      <h3>Join a room</h3>
      <div class="row">
        <input type="text" id="joinCode" placeholder="123456" maxlength="6" inputmode="numeric">
        <button class="btn btn-primary" onclick="joinRoom()">Connect</button>
      </div>
    </div>

    <div class="section" id="devicesCard">
      <h3>Devices</h3>
      <input type="text" id="deviceFilter" placeholder="Filter devices..." style="margin-bottom:8px">
      <div id="peerList"><div class="empty">none connected yet</div></div>
    </div>
  </aside>

  <main class="workspace">
    <div id="drop">Drag files or folders anywhere on this page, or use + Add file/folder below</div>
    <input type="file" id="fileInput" multiple class="hidden">
    <div class="workspace-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">+ Add file/folder</button>
      <button class="btn btn-primary" id="sendBtn" disabled>Send files</button>
    </div>
  </main>

  <aside class="rightpanel">
    <div class="tabs">
      <button class="tab active" id="queueTab" onclick="switchTab('queue')">Queue</button>
      <button class="tab" id="historyTab" onclick="switchTab('history')">History</button>
    </div>
    <div id="queueList" class="tabpanel"><div class="empty">No files queued. Add files and hit Send.</div></div>
    <div id="historyList" class="tabpanel hidden"><div class="empty">nothing yet</div></div>
  </aside>

</div>

<script>
const VERSION = 'v23';
document.getElementById('versionTag').textContent = '· ' + VERSION;

// A stuck old Service Worker from an earlier version of this page could
// still be intercepting requests and breaking things. That whole approach
// is gone now - proactively clear out any leftover registration.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

function detectOS() {
  const ua = navigator.userAgent;
  if (/Windows/.test(ua)) return 'WIN';
  if (/Mac/.test(ua)) return 'MAC';
  if (/Android/.test(ua)) return 'AND';
  if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
  if (/Linux/.test(ua)) return 'LNX';
  return '?';
}
const MY_OS = detectOS();

let peer;
const conns = new Map(); // conn.peer -> { conn, name, os }
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
const nameInput = document.getElementById('myName');
nameInput.value = localStorage.getItem('shareName') || '';
nameInput.addEventListener('input', () => localStorage.setItem('shareName', nameInput.value));

function myName() { return nameInput.value.trim() || 'a device'; }
function initials(n) { return n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?'; }
function setStatus(s, dotClass) {
  statusEl.textContent = s;
  dotEl.className = 'dot' + (dotClass ? ' ' + dotClass : '');
}
function renderPeerList() {
  const box = document.getElementById('peerList');
  if (!conns.size) { box.innerHTML = '<div class="empty">none connected yet</div>'; return; }
  const filter = document.getElementById('deviceFilter').value.trim().toLowerCase();
  const matches = [...conns.values()].filter(({ name }) => name.toLowerCase().includes(filter));
  if (!matches.length) { box.innerHTML = '<div class="empty">no devices match</div>'; updateSendButton(); return; }
  box.innerHTML = '';
  for (const { name, os } of matches) {
    const row = document.createElement('div');
    row.className = 'device-row';
    row.innerHTML = `<span class="avatar">${initials(name)}</span><span>${name}</span>` +
      `<span class="os-badge">${os || '?'}</span><span class="dot"></span>`;
    box.appendChild(row);
  }
  updateSendButton();
}
document.getElementById('deviceFilter').addEventListener('input', renderPeerList);

const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function randomCode() { return String(Math.floor(100000 + Math.random() * 900000)); }

function createRoom() {
  const code = randomCode();
  setStatus('opening room ' + code + '...', 'pending');
  peer = new Peer(code, { config: ICE_CONFIG });
  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('codeBox').classList.remove('hidden');
    const url = location.origin + location.pathname + '?code=' + code;
    document.getElementById('qrbox').innerHTML = '';
    new QRCode(document.getElementById('qrbox'), { text: url, width: 110, height: 110 });
    setStatus('waiting for devices to join...', 'pending');
    document.getElementById('joinStep').classList.add('hidden'); // already hosting - code stays visible so more can join
  });
  peer.on('connection', c => addConn(c));
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { createRoom(); return; }
    setStatus('error: ' + err.type, 'err');
    alert('Connection setup failed: ' + err.type);
  });
}

function joinRoom(codeOverride) {
  const code = codeOverride || document.getElementById('joinCode').value.trim();
  if (!/^\d{4,6}$/.test(code)) { alert('enter the 4-6 digit code'); return; }
  setStatus('connecting to room ' + code + '...', 'pending');
  peer = new Peer({ config: ICE_CONFIG });
  peer.on('open', () => {
    addConn(peer.connect(code, { reliable: true, metadata: { name: myName(), os: MY_OS } }));
    document.getElementById('createStep').classList.add('hidden');
    document.getElementById('joinStep').classList.add('hidden');
  });
  peer.on('connection', c => addConn(c));
  peer.on('error', err => {
    setStatus('error: ' + err.type, 'err');
    alert('Could not connect: ' + err.type + (err.type === 'peer-unavailable' ? ' — check the code' : ''));
  });
}

// PeerJS's default "binary" serialization silently corrupts ArrayBuffers
// sent through conn.send() (data arrives truncated to 0 bytes) - a library
// bug, reproduced directly against unpkg's build. PeerJS is used only to
// establish the connection (room codes, ICE/NAT traversal); all real
// traffic goes straight over the underlying RTCDataChannel, bypassing
// PeerJS's serializer entirely.
function addConn(conn) {
  const entry = { conn, name: (conn.metadata && conn.metadata.name) || 'a device', os: (conn.metadata && conn.metadata.os) || null };
  conns.set(conn.peer, entry);
  conn.on('open', () => {
    const dc = conn.dataChannel;
    dc.binaryType = 'arraybuffer';
    dc.send(JSON.stringify({ type: 'hello', name: myName(), os: MY_OS }));
    setStatus(conns.size + ' device' + (conns.size > 1 ? 's' : '') + ' connected', 'live');
    renderPeerList();

    // The browser fires 'message' events as packets arrive, without waiting
    // for a previous async handler call to finish - if handling one message
    // awaits something, later messages for the same file can be dispatched
    // and evaluated before conn._incoming is even set, and get silently
    // dropped. Chain them through one queue per connection so message N+1
    // never starts until message N is fully processed.
    let msgQueue = Promise.resolve();
    dc.onmessage = (e) => {
      msgQueue = msgQueue.then(async () => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'hello') {
            entry.name = msg.name;
            entry.os = msg.os;
            renderPeerList();
          } else if (msg.type === 'file-start') {
            addPendingRow(msg.name, entry.name);
            conn._incoming = startIncoming(msg.name, msg.size, entry.name);
          } else if (msg.type === 'file-end' && conn._incoming) {
            await conn._incoming.finish();
            dc.send(JSON.stringify({ type: 'delivered', name: conn._incoming.name }));
            conn._incoming = null;
          } else if (msg.type === 'delivered') {
            markDelivered(conn.peer, msg.name);
          }
        } else if (conn._incoming) {
          await conn._incoming.write(e.data);
        }
      });
    };
  });
  conn.on('close', () => {
    conns.delete(conn.peer);
    renderPeerList();
    setStatus(conns.size ? conns.size + ' device' + (conns.size > 1 ? 's' : '') + ' connected' : 'disconnected', conns.size ? 'live' : 'err');
  });
  conn.on('error', err => console.error('connection error', err));
}

// ---- receiving ----
//
// Earlier versions tried streaming straight to disk via the File System
// Access API (needs a live user gesture that never exists here - the file
// arrives async off the network) and then a Service Worker relay (fragile
// in practice: old SW versions get stuck controlling the page since
// browsers don't swap them in immediately, and GitHub Pages caches sw.js
// itself, both causing real, hard-to-diagnose failures). Buffering in
// memory has never failed in testing and needs none of that machinery.
// ponytail: whole file held in memory - fine up to ~1-2GB depending on
// the device; for reliably handling bigger files, self-host something
// like polius/FileSync instead.
function startIncoming(name, size, fromName) {
  const chunks = [];
  return {
    name,
    write: (chunk) => { chunks.push(chunk); },
    finish: async () => {
      const url = URL.createObjectURL(new Blob(chunks));
      // The History row's link only downloads when clicked - if nothing
      // ever gets clicked, the file exists in the tab but never reaches
      // disk. Trigger the save automatically the moment it's ready; the
      // row stays as a link too, for re-downloading later.
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      addReceivedRow(name, size, fromName, url);
    }
  };
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtTime() {
  return new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
}

// ---- tabs ----

function switchTab(which) {
  document.getElementById('queueTab').classList.toggle('active', which === 'queue');
  document.getElementById('historyTab').classList.toggle('active', which === 'history');
  document.getElementById('queueList').classList.toggle('hidden', which !== 'queue');
  document.getElementById('historyList').classList.toggle('hidden', which !== 'history');
}

// ---- history: received + sent activity ----

const pendingRows = new Map();

function addPendingRow(name, fromName) {
  const list = document.getElementById('historyList');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'filerow';
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<div class="name">${name}</div><div class="from">receiving from ${fromName}...</div>`;
  row.appendChild(meta);
  list.prepend(row);
  pendingRows.set(fromName + '|' + name, row);
}

function addReceivedRow(name, size, fromName, blobUrl) {
  const list = document.getElementById('historyList');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const pendingKey = fromName + '|' + name;
  const existing = pendingRows.get(pendingKey);
  pendingRows.delete(pendingKey);
  const row = existing || document.createElement('div');
  row.className = 'filerow';
  row.innerHTML = '';
  const badge = document.createElement('span');
  badge.className = 'badge in'; badge.textContent = '↓';
  row.appendChild(badge);
  const meta = document.createElement('div');
  meta.className = 'meta';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  if (blobUrl) {
    const a = document.createElement('a');
    a.href = blobUrl; a.download = name; a.textContent = name;
    nameEl.appendChild(a);
  } else {
    nameEl.textContent = name;
  }
  const fromEl = document.createElement('div');
  fromEl.className = 'from';
  fromEl.textContent = 'received from ' + fromName;
  meta.appendChild(nameEl); meta.appendChild(fromEl);
  row.appendChild(meta);
  const right = document.createElement('div');
  right.className = 'right';
  const sizeEl = document.createElement('span');
  sizeEl.className = 'size'; sizeEl.textContent = fmtSize(size);
  const timeEl = document.createElement('span');
  timeEl.className = 'time'; timeEl.textContent = fmtTime();
  right.appendChild(sizeEl); right.appendChild(timeEl);
  row.appendChild(right);
  const discard = document.createElement('button');
  discard.textContent = 'Discard';
  discard.onclick = () => { if (blobUrl) URL.revokeObjectURL(blobUrl); row.remove(); showHistoryEmptyIfNeeded(); };
  row.appendChild(discard);
  if (!existing) list.prepend(row);
}

function showHistoryEmptyIfNeeded() {
  const list = document.getElementById('historyList');
  if (!list.children.length) list.innerHTML = '<div class="empty">nothing yet</div>';
}

const sentRows = new Map(); // peerId|name -> { row, statusEl }

function addSentRow(peerId, name, size, toName) {
  const list = document.getElementById('historyList');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'filerow';
  const badge = document.createElement('span');
  badge.className = 'badge out'; badge.textContent = '↑';
  row.appendChild(badge);
  const meta = document.createElement('div');
  meta.className = 'meta';
  const nameEl = document.createElement('div');
  nameEl.className = 'name'; nameEl.textContent = name;
  const statusEl = document.createElement('div');
  statusEl.className = 'from'; statusEl.textContent = 'sending to ' + toName + '...';
  meta.appendChild(nameEl); meta.appendChild(statusEl);
  row.appendChild(meta);
  const right = document.createElement('div');
  right.className = 'right';
  const sizeEl = document.createElement('span');
  sizeEl.className = 'size'; sizeEl.textContent = fmtSize(size);
  const timeEl = document.createElement('span');
  timeEl.className = 'time'; timeEl.textContent = fmtTime();
  right.appendChild(sizeEl); right.appendChild(timeEl);
  row.appendChild(right);
  list.prepend(row);
  sentRows.set(peerId + '|' + name, { row, statusEl, toName });
}

function markSent(peerId, name) {
  const entry = sentRows.get(peerId + '|' + name);
  if (entry) entry.statusEl.textContent = 'sent to ' + entry.toName + ', waiting for confirmation...';
}

function markDelivered(peerId, name) {
  const entry = sentRows.get(peerId + '|' + name);
  if (entry) entry.statusEl.innerHTML = '✓ delivered to ' + entry.toName;
}

// ---- queue: files staged before sending ----

let queue = []; // array of File (folders already zipped into one File each)

function renderQueue() {
  const list = document.getElementById('queueList');
  if (!queue.length) { list.innerHTML = '<div class="empty">No files queued. Add files and hit Send.</div>'; updateSendButton(); return; }
  list.innerHTML = '';
  queue.forEach((file, i) => {
    const row = document.createElement('div');
    row.className = 'filerow';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<div class="name">${file.name}</div><div class="from">queued</div>`;
    row.appendChild(meta);
    const sizeEl = document.createElement('span');
    sizeEl.className = 'size'; sizeEl.textContent = fmtSize(file.size);
    row.appendChild(sizeEl);
    const remove = document.createElement('button');
    remove.textContent = 'Remove';
    remove.onclick = () => { queue.splice(i, 1); renderQueue(); };
    row.appendChild(remove);
    list.appendChild(row);
  });
  updateSendButton();
}

function updateSendButton() {
  const targets = [...conns.values()].filter(e => e.conn.open);
  document.getElementById('sendBtn').disabled = !queue.length || !targets.length;
}

// ---- preparing dropped/picked items: folders get zipped into one file ----
//
// A browser can only ever trigger individual file downloads - there's no
// way for a webpage to write an actual folder to the receiver's disk in
// one action. Sending a folder's files individually means the receiver
// gets N separate downloads instead of "the folder". Zipping the folder
// into one file before sending is the only way to deliver it as a single
// download; the receiver extracts it locally to get the folder back.
async function zipFolder(folderName, files) {
  const zip = new JSZip();
  for (const f of files) {
    zip.file(f.webkitRelativePath.slice(folderName.length + 1), f);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  return new File([blob], folderName + '.zip');
}

async function prepareFiles(fileList) {
  const loose = [];
  const folders = new Map(); // top-level folder name -> its files
  for (const f of fileList) {
    const rel = f.webkitRelativePath;
    if (rel && rel.includes('/')) {
      const top = rel.split('/')[0];
      if (!folders.has(top)) folders.set(top, []);
      folders.get(top).push(f);
    } else {
      loose.push(f);
    }
  }
  const prepared = [...loose];
  for (const [folderName, files] of folders) {
    try {
      prepared.push(await zipFolder(folderName, files));
    } catch (err) {
      alert("Couldn't zip " + folderName + ': ' + err.message);
    }
  }
  return prepared;
}

async function addToQueue(fileList) {
  const prepared = await prepareFiles(fileList);
  queue.push(...prepared);
  renderQueue();
  switchTab('queue');
}

// ---- sending ----

const CHUNK = 16 * 1024;
// A folder's files carry their relative path in .webkitRelativePath - that
// path is used as the transferred "name" throughout, so the receiver
// naturally shows "MyFolder/photo.jpg" and Chrome recreates the subfolder
// under Downloads on save (a "/" in a download's suggested filename does
// that automatically - no directory-picker or extra protocol needed).
async function sendFileTo(conn, file, toName) {
  const dc = conn.dataChannel;
  const path = file.webkitRelativePath || file.name;
  addSentRow(conn.peer, path, file.size, toName);
  dc.send(JSON.stringify({ type: 'file-start', name: path, size: file.size }));
  const reader = file.stream().getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    for (let off = 0; off < value.byteLength; off += CHUNK) {
      const slice = value.slice(off, off + CHUNK).buffer;
      while (dc.bufferedAmount > 8 * 1024 * 1024) {
        await new Promise(r => setTimeout(r, 20));
      }
      dc.send(slice);
    }
  }
  dc.send(JSON.stringify({ type: 'file-end' }));
  markSent(conn.peer, path);
}

document.getElementById('sendBtn').addEventListener('click', async () => {
  const targets = [...conns.values()].filter(e => e.conn.open);
  if (!targets.length) { alert('not connected yet'); return; }
  if (!queue.length) return;
  const toSend = queue;
  queue = [];
  renderQueue();
  switchTab('history');
  for (const file of toSend) {
    try {
      for (const { conn, name } of targets) await sendFileTo(conn, file, name);
    } catch (err) {
      alert('send failed: ' + err.message);
    }
  }
});

// Plain drag-drop only gives top-level dropped items; a dropped folder's
// contents need walking its DataTransferItem entry tree explicitly.
// Hidden entries (dotfiles/dotfolders - .git, .DS_Store, etc.) are
// skipped: dragging a project folder should send the project, not its
// VCS internals.
function readEntry(entry, prefix) {
  return new Promise(resolve => {
    if (entry.name.startsWith('.')) { resolve([]); return; }
    if (entry.isFile) {
      entry.file(file => {
        try {
          Object.defineProperty(file, 'webkitRelativePath', { value: prefix + file.name });
        } catch (err) { /* ignore, falls back to plain file.name */ }
        resolve([file]);
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => reader.readEntries(async (batch) => {
        if (!batch.length) {
          const nested = await Promise.all(all.map(en => readEntry(en, prefix + entry.name + '/')));
          resolve(nested.flat());
        } else {
          all.push(...batch);
          readBatch();
        }
      });
      readBatch();
    } else {
      resolve([]);
    }
  });
}

async function filesFromDrop(dataTransfer) {
  const items = dataTransfer.items;
  if (!items || !items.length || !items[0].webkitGetAsEntry) return [...dataTransfer.files];
  const entries = [...items].map(i => i.webkitGetAsEntry()).filter(Boolean);
  const nested = await Promise.all(entries.map(e => readEntry(e, '')));
  return nested.flat();
}

// The drop target is the whole page, not just the box - without a
// document-level preventDefault, dropping anywhere outside that box falls
// through to the browser's own default action, which navigates the tab
// to show the raw file/folder instead of any of our JS ever running.
const drop = document.getElementById('drop');
let dragDepth = 0;
document.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  drop.classList.add('over');
  document.body.classList.add('dragging');
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) { drop.classList.remove('over'); document.body.classList.remove('dragging'); }
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove('over');
  document.body.classList.remove('dragging');
  try {
    const files = await filesFromDrop(e.dataTransfer);
    if (!files.length) { alert("Couldn't read anything from that drop - try again, or use + Add file/folder."); return; }
    addToQueue(files);
  } catch (err) {
    alert('Reading the dropped item failed: ' + err.message);
  }
});

document.getElementById('fileInput').addEventListener('change', e => {
  addToQueue([...e.target.files]);
  e.target.value = '';
});

// auto-join if opened from a QR code / shared link
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) {
  document.getElementById('joinCode').value = urlCode;
  joinRoom(urlCode);
}
</script>
