<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#8a8a8e;
  --blue:#007aff; --red:#ff3b30; --green:#34c759; --border:#e5e5ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --sub:#8a8a8e; --border:#2c2c2e; }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:24px 16px 60px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin:8px 0 2px;text-align:center}
.tagline{color:var(--sub);font-size:13px;text-align:center;margin:0 0 24px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--sub);
  text-transform:uppercase;letter-spacing:.4px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
input[type=text]{
  width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
  font-size:16px;background:transparent;color:var(--text);outline:none;
}
input[type=text]:focus{border-color:var(--blue)}
.btn{
  width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;
  cursor:pointer;margin-top:10px;transition:opacity .15s;
}
.btn:active{opacity:.7}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.row{display:flex;gap:10px}
.row input{flex:1}
.code{font-size:34px;font-weight:700;letter-spacing:6px;text-align:center;
  padding:4px 0 12px;color:var(--blue)}
#qrbox{display:flex;justify-content:center;padding:8px 0 4px}
#qrbox img,#qrbox canvas{border-radius:10px}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.dot.live{background:var(--green)}
.dot.pending{background:#ff9500}
.dot.err{background:var(--red)}
.peer{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.peer .dot{background:var(--green)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
#drop{
  border:2px dashed var(--border);border-radius:14px;padding:36px 16px;text-align:center;
  color:var(--sub);font-size:14px;margin-bottom:10px;transition:.15s;
}
#drop.over{border-color:var(--blue);background:rgba(0,122,255,.06)}
.filerow{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.filerow:last-child{border-bottom:none}
.filerow .meta{flex:1;overflow:hidden}
.filerow .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .name a{color:var(--text);text-decoration:none}
.filerow .from{font-size:11px;color:var(--sub)}
.filerow .size{font-size:12px;color:var(--sub);flex:none}
.filerow button{
  flex:none;border:none;background:none;color:var(--red);font-size:13px;
  cursor:pointer;padding:4px 6px;
}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:8px 0}
.hidden{display:none !important}
</style></head>
<body>
<div class="wrap">
  <h1>Share</h1>
  <p class="tagline">Direct device-to-device. Nothing touches a server.</p>

  <div class="card">
    <h3>Your name</h3>
    <input type="text" id="myName" placeholder="e.g. Akhil's laptop" maxlength="30">
  </div>

  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="status">not connected</span></div>
    <div id="peerList"></div>
  </div>

  <div class="card" id="createStep">
    <h3>Start a room</h3>
    <button class="btn btn-primary" onclick="createRoom()">Create room</button>
    <div id="codeBox" class="hidden">
      <div class="code" id="roomCode"></div>
      <div id="qrbox"></div>
      <label style="text-align:center">share the code, or scan the QR to join</label>
    </div>
  </div>

  <div class="card" id="joinStep">
    <h3>Join a room</h3>
    <div class="row">
      <input type="text" id="joinCode" placeholder="123456" maxlength="6" inputmode="numeric">
      <button class="btn btn-primary" style="width:auto;flex:none;padding:13px 20px" onclick="joinRoom()">Connect</button>
    </div>
  </div>

  <div id="transfer" class="hidden">
    <div class="card">
      <h3>Send</h3>
      <div id="drop">Drag files here, or</div>
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">+ Add file</button>
      <input type="file" id="fileInput" multiple class="hidden">
    </div>
    <div class="card">
      <h3>Received</h3>
      <div id="list"><div class="empty">nothing yet</div></div>
    </div>
  </div>
</div>

<script>
let peer;
const conns = new Map(); // conn.peer -> { conn, name }
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
const nameInput = document.getElementById('myName');
nameInput.value = localStorage.getItem('shareName') || '';
nameInput.addEventListener('input', () => localStorage.setItem('shareName', nameInput.value));

function myName() { return nameInput.value.trim() || 'a device'; }
function initials(n) { return n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?'; }
function setStatus(s, dotClass) {
  statusEl.textContent = s;
  dotEl.className = 'dot' + (dotClass ? ' ' + dotClass : '');
}
function renderPeerList() {
  const box = document.getElementById('peerList');
  box.innerHTML = '';
  for (const { name } of conns.values()) {
    const row = document.createElement('div');
    row.className = 'peer';
    row.innerHTML = `<span class="avatar">${initials(name)}</span><span>${name}</span><span class="dot"></span>`;
    box.appendChild(row);
  }
}

const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function randomCode() { return String(Math.floor(100000 + Math.random() * 900000)); }

function showTransfer(keepCode) {
  if (!keepCode) document.getElementById('createStep').classList.add('hidden');
  document.getElementById('joinStep').classList.add('hidden');
  document.getElementById('transfer').classList.remove('hidden');
}

function createRoom() {
  const code = randomCode();
  setStatus('opening room ' + code + '...', 'pending');
  peer = new Peer(code, { config: ICE_CONFIG });
  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('codeBox').classList.remove('hidden');
    const url = location.origin + location.pathname + '?code=' + code;
    document.getElementById('qrbox').innerHTML = '';
    new QRCode(document.getElementById('qrbox'), { text: url, width: 160, height: 160 });
    setStatus('waiting for devices to join...', 'pending');
    showTransfer(true); // room code stays visible - more people can still join
  });
  peer.on('connection', c => addConn(c));
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { createRoom(); return; }
    setStatus('error: ' + err.type, 'err');
    alert('Connection setup failed: ' + err.type);
  });
}

function joinRoom(codeOverride) {
  const code = codeOverride || document.getElementById('joinCode').value.trim();
  if (!/^\d{4,6}$/.test(code)) { alert('enter the 4-6 digit code'); return; }
  setStatus('connecting to room ' + code + '...', 'pending');
  peer = new Peer({ config: ICE_CONFIG });
  peer.on('open', () => {
    addConn(peer.connect(code, { reliable: true, metadata: { name: myName() } }));
    showTransfer();
  });
  peer.on('connection', c => addConn(c));
  peer.on('error', err => {
    setStatus('error: ' + err.type, 'err');
    alert('Could not connect: ' + err.type + (err.type === 'peer-unavailable' ? ' — check the code' : ''));
  });
}

// PeerJS's default "binary" serialization silently corrupts ArrayBuffers
// sent through conn.send() (data arrives truncated to 0 bytes) - a library
// bug, reproduced directly against unpkg's build. PeerJS is used only to
// establish the connection (room codes, ICE/NAT traversal); all real
// traffic goes straight over the underlying RTCDataChannel, bypassing
// PeerJS's serializer entirely.
function addConn(conn) {
  const entry = { conn, name: (conn.metadata && conn.metadata.name) || 'a device' };
  conns.set(conn.peer, entry);
  conn.on('open', () => {
    const dc = conn.dataChannel;
    dc.binaryType = 'arraybuffer';
    dc.send(JSON.stringify({ type: 'hello', name: myName() }));
    setStatus(conns.size + ' device' + (conns.size > 1 ? 's' : '') + ' connected', 'live');
    renderPeerList();

    // The browser fires 'message' events as packets arrive, without waiting
    // for a previous async handler call to finish - if handling one message
    // awaits something (the SW handshake below), later messages for the same
    // file can be dispatched and evaluated before conn._incoming is even set,
    // and get silently dropped. Chain them through one queue per connection
    // so message N+1 never starts until message N is fully processed.
    let queue = Promise.resolve();
    dc.onmessage = (e) => {
      queue = queue.then(async () => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'hello') {
            entry.name = msg.name;
            renderPeerList();
          } else if (msg.type === 'file-start') {
            addPendingRow(msg.name, entry.name);
            conn._incoming = await startIncoming(msg.name, msg.size, entry.name);
          } else if (msg.type === 'file-end' && conn._incoming) {
            await conn._incoming.finish();
            conn._incoming = null;
          }
        } else if (conn._incoming) {
          await conn._incoming.write(e.data);
        }
      });
    };
  });
  conn.on('close', () => {
    conns.delete(conn.peer);
    renderPeerList();
    setStatus(conns.size ? conns.size + ' device' + (conns.size > 1 ? 's' : '') + ' connected' : 'disconnected', conns.size ? 'live' : 'err');
  });
  conn.on('error', err => console.error('connection error', err));
}

// ---- receiving: streams to disk, never buffers the whole file ----

let swReadyPromise = null;
if ('serviceWorker' in navigator) {
  swReadyPromise = navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready);
}

async function startIncoming(name, size, fromName) {
  // Note: the File System Access API's showSaveFilePicker() requires a live
  // user gesture, which doesn't exist when a file starts arriving async over
  // the network - it can't be used here. The Service Worker path below needs
  // no gesture and still streams straight to disk, so it's the primary tier.
  if (swReadyPromise) {
    try {
      await swReadyPromise;
      if (navigator.serviceWorker.controller) {
        const id = Date.now() + '-' + Math.random().toString(36).slice(2);
        const channel = new MessageChannel();
        const ready = new Promise(resolve => {
          navigator.serviceWorker.addEventListener('message', function onMsg(e) {
            if (e.data && e.data.type === 'stream-ready' && e.data.id === id) {
              navigator.serviceWorker.removeEventListener('message', onMsg);
              resolve();
            }
          });
        });
        navigator.serviceWorker.controller.postMessage(
          { type: 'stream-start', id, filename: name, size }, [channel.port2]
        );
        await ready;
        const a = document.createElement('a');
        a.href = location.pathname.replace(/\/[^/]*$/, '/') + '__download__/' + id;
        a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        return {
          write: (chunk) => channel.port1.postMessage({ type: 'chunk', buffer: chunk }, [chunk]),
          finish: async () => { channel.port1.postMessage({ type: 'end' }); addReceivedRow(name, size, fromName, null); }
        };
      }
    } catch (err) { console.error('SW streaming failed, falling back to memory', err); }
  }
  // Tier 3: buffer in memory - last resort, only for browsers with neither API.
  const chunks = [];
  return {
    write: (chunk) => { chunks.push(chunk); },
    finish: async () => {
      const url = URL.createObjectURL(new Blob(chunks));
      addReceivedRow(name, size, fromName, url);
    }
  };
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

const pendingRows = new Map();

function addPendingRow(name, fromName) {
  const list = document.getElementById('list');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'filerow';
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<div class="name">${name}</div><div class="from">receiving from ${fromName}...</div>`;
  row.appendChild(meta);
  list.appendChild(row);
  pendingRows.set(fromName + '|' + name, row);
}

function addReceivedRow(name, size, fromName, blobUrl) {
  const list = document.getElementById('list');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const pendingKey = fromName + '|' + name;
  const existing = pendingRows.get(pendingKey);
  pendingRows.delete(pendingKey);
  const row = existing || document.createElement('div');
  row.className = 'filerow';
  row.innerHTML = '';
  const meta = document.createElement('div');
  meta.className = 'meta';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  if (blobUrl) {
    const a = document.createElement('a');
    a.href = blobUrl; a.download = name; a.textContent = name;
    nameEl.appendChild(a);
  } else {
    nameEl.textContent = name;
  }
  const fromEl = document.createElement('div');
  fromEl.className = 'from';
  fromEl.textContent = 'from ' + fromName;
  meta.appendChild(nameEl); meta.appendChild(fromEl);
  row.appendChild(meta);
  const sizeEl = document.createElement('span');
  sizeEl.className = 'size'; sizeEl.textContent = fmtSize(size);
  row.appendChild(sizeEl);
  const discard = document.createElement('button');
  discard.textContent = 'Discard';
  discard.onclick = () => { if (blobUrl) URL.revokeObjectURL(blobUrl); row.remove(); showEmptyIfNeeded(); };
  row.appendChild(discard);
  if (!existing) list.appendChild(row);
}

function showEmptyIfNeeded() {
  const list = document.getElementById('list');
  if (!list.children.length) list.innerHTML = '<div class="empty">nothing yet</div>';
}

// ---- sending ----

const CHUNK = 16 * 1024;
async function sendFileTo(conn, file) {
  const dc = conn.dataChannel;
  dc.send(JSON.stringify({ type: 'file-start', name: file.name, size: file.size }));
  const reader = file.stream().getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    for (let off = 0; off < value.byteLength; off += CHUNK) {
      const slice = value.slice(off, off + CHUNK).buffer;
      while (dc.bufferedAmount > 8 * 1024 * 1024) {
        await new Promise(r => setTimeout(r, 20));
      }
      dc.send(slice);
    }
  }
  dc.send(JSON.stringify({ type: 'file-end' }));
}

async function sendFiles(fileList) {
  const targets = [...conns.values()].filter(e => e.conn.open);
  if (!targets.length) { alert('not connected yet'); return; }
  const drop = document.getElementById('drop');
  for (const file of fileList) {
    drop.textContent = 'sending ' + file.name + '...';
    try {
      for (const { conn } of targets) await sendFileTo(conn, file);
    } catch (err) {
      alert('send failed: ' + err.message);
      break;
    }
  }
  drop.textContent = 'Drag files here, or';
}

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => sendFiles(e.dataTransfer.files));

document.getElementById('fileInput').addEventListener('change', e => {
  sendFiles(e.target.files);
  e.target.value = '';
});

// auto-join if opened from a QR code / shared link
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) {
  document.getElementById('joinCode').value = urlCode;
  joinRoom(urlCode);
}
</script>
</body></html>
