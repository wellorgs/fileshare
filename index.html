<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P File Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{font-family:sans-serif;max-width:680px;margin:30px auto;padding:0 16px;line-height:1.4}
h2{margin-bottom:4px}
.step{border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}
.step h3{margin:0 0 8px}
.code{font-size:32px;font-weight:bold;letter-spacing:4px;text-align:center;padding:14px;background:#f4f4f4;border-radius:8px}
input{padding:8px;font-size:18px;width:140px;text-align:center;letter-spacing:2px}
button{padding:8px 14px;margin-top:6px;cursor:pointer}
#drop{border:3px dashed #888;border-radius:12px;padding:50px 20px;text-align:center;color:#555;margin:14px 0}
#drop.over{border-color:#08c;background:#eef8ff}
#status{font-weight:bold}
li{margin:4px 0}
.hidden{display:none}
small{color:#666}
</style></head>
<body>
<h2>P2P File Share</h2>
<small>Direct browser-to-browser transfer. No server ever sees your files.</small>

<div class="step">
  <h3>Status</h3>
  <div id="status">not connected</div>
</div>

<div class="step" id="createStep">
  <h3>Option A: Create a room</h3>
  <button onclick="createRoom()">Create room</button>
  <div id="codeBox" class="hidden">
    <p>Give this code to the other device:</p>
    <div class="code" id="roomCode"></div>
  </div>
</div>

<div class="step" id="joinStep">
  <h3>Option B: Join with a code</h3>
  <input id="joinCode" maxlength="6" placeholder="123456">
  <button onclick="joinRoom()">Connect</button>
</div>

<div id="transfer" class="step hidden">
  <h3>Send a file</h3>
  <div id="drop">Drag a file here to send it</div>
  <h3>Received files</h3>
  <ul id="list"><li>(none yet)</li></ul>
</div>

<script>
let peer, conn;
const statusEl = document.getElementById('status');
function setStatus(s) { statusEl.textContent = s; console.log('[status]', s); }

// Plain STUN fails on plenty of home routers (no NAT hairpin support) - add a
// free public TURN relay as fallback so the connection actually completes.
const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function randomCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function createRoom() {
  const code = randomCode();
  setStatus('opening room ' + code + '...');
  peer = new Peer(code, { config: ICE_CONFIG });
  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('codeBox').classList.remove('hidden');
    setStatus('room ' + code + ' open — waiting for the other device...');
  });
  peer.on('connection', c => { conn = c; setupConnection(); });
  peer.on('disconnected', () => setStatus('lost connection to signaling server, retrying...'));
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { createRoom(); } // code taken, try another
    else { setStatus('error: ' + err.type); alert('Connection setup failed: ' + err.type); }
  });
}

function joinRoom() {
  const code = document.getElementById('joinCode').value.trim();
  if (!/^\d{4,6}$/.test(code)) { alert('enter the 4-6 digit code'); return; }
  setStatus('connecting to room ' + code + '...');
  peer = new Peer({ config: ICE_CONFIG });
  peer.on('open', () => {
    conn = peer.connect(code, { reliable: true });
    setupConnection();
  });
  peer.on('error', err => {
    setStatus('error: ' + err.type);
    alert('Could not connect: ' + err.type + (err.type === 'peer-unavailable' ? ' (check the code, or the other device may not have created the room yet)' : ''));
  });
}

function setupConnection() {
  setStatus('found ' + conn.peer + ', negotiating connection...');
  conn.on('open', () => {
    setStatus('connected to room ' + conn.peer);
    document.getElementById('transfer').classList.remove('hidden');
  });
  conn.on('close', () => setStatus('disconnected'));
  conn.on('error', err => { setStatus('connection error: ' + err); alert('Connection error: ' + err); });
  let incoming = null;
  conn.on('data', async (data) => {
    if (data && data.type === 'file-start') {
      incoming = { name: data.name, size: data.size, writer: null, chunks: [] };
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({ suggestedName: data.name });
          incoming.writer = await handle.createWritable();
        } catch (err) { incoming.writer = null; }
      }
    } else if (data && data.type === 'file-end' && incoming) {
      if (incoming.writer) {
        await incoming.writer.close();
      } else {
        const blob = new Blob(incoming.chunks);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = incoming.name; a.textContent = incoming.name;
        const li = document.createElement('li');
        li.appendChild(a);
        const list = document.getElementById('list');
        if (list.children[0]?.textContent === '(none yet)') list.innerHTML = '';
        list.appendChild(li);
      }
      incoming = null;
    } else if (incoming && data instanceof ArrayBuffer) {
      if (incoming.writer) await incoming.writer.write(data);
      else incoming.chunks.push(data);
    }
  });
}

const CHUNK = 16 * 1024;
async function sendFile(file) {
  conn.send({ type: 'file-start', name: file.name, size: file.size });
  const reader = file.stream().getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    for (let off = 0; off < value.byteLength; off += CHUNK) {
      const slice = value.slice(off, off + CHUNK).buffer;
      while ((conn.dataChannel?.bufferedAmount || 0) > 8 * 1024 * 1024) {
        await new Promise(r => setTimeout(r, 20));
      }
      conn.send(slice);
    }
  }
  conn.send({ type: 'file-end' });
}

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', async e => {
  if (!conn || !conn.open) { alert('not connected yet — wait for status to say "connected"'); return; }
  for (const file of e.dataTransfer.files) {
    drop.textContent = 'sending ' + file.name + '...';
    try {
      await sendFile(file);
    } catch (err) {
      alert('send failed: ' + err.message);
      break;
    }
  }
  drop.textContent = 'Drag a file here to send it';
});
</script>
</body></html>
