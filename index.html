<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette matches the reference design 1:1 (GitHub dark theme colors). */
:root{
  --bg:#0d1117; --panel:#161b22; --card:#21262d; --text:#e6edf3; --sub:#8b949e;
  --blue:#1f6feb; --red:#f85149; --green:#3fb950; --orange:#ffa657; --border:#30363d;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",monospace;
  --font-sans:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:13px;font-weight:600;margin:0;font-family:var(--font-mono);letter-spacing:-.26px}
.tagline{color:var(--sub);font-size:10px;margin:2px 0 0;font-family:var(--font-mono)}
h3{margin:0 0 10px;font-size:10px;font-weight:500;color:var(--sub);
  text-transform:uppercase;letter-spacing:1px;font-family:var(--font-sans)}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:6px}
input[type=text]{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;
  font-size:12px;background:transparent;color:var(--text);outline:none;font-family:var(--font-mono);
}
input[type=text]:focus{border-color:var(--blue)}
input[type=text]::placeholder{color:var(--sub)}
.btn{
  padding:9px 14px;border:none;border-radius:6px;font-size:12.5px;font-weight:500;
  cursor:pointer;transition:opacity .15s;font-family:var(--font-sans);
}
.btn:active{opacity:.7}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.row{display:flex;gap:8px}
.row input{flex:1}
.row .btn{flex:none;width:auto}
.code{font-size:26px;font-weight:700;letter-spacing:4px;text-align:center;
  padding:2px 0 8px;color:var(--blue);font-family:var(--font-mono)}
#qrbox{display:flex;justify-content:center;padding:6px 0 2px}
#qrbox img,#qrbox canvas{border-radius:8px;width:110px;height:110px}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);font-family:var(--font-mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sub);flex:none}
.dot.live{background:var(--green)}
.dot.pending{background:var(--orange)}
.dot.busy{background:var(--orange)}
.dot.err{background:var(--red)}
.hidden{display:none !important}

/* ---- app shell: top bar + sidebar / workspace / queue+history ---- */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.topbar-brand{display:flex;align-items:center;gap:8px}
.brand-icon{width:22px;height:22px;border-radius:5px;background:var(--blue);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff}
.topbar .tagline{margin:0}
.topbar-me{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;color:var(--sub)}
.panels{display:flex;flex-direction:column;flex:1;min-height:0}
.sidebar,.rightpanel{padding:16px;display:flex;flex-direction:column;gap:12px}
.sidebar{background:var(--panel);border-bottom:1px solid var(--border)}
.rightpanel{background:var(--panel);border-top:1px solid var(--border)}
.workspace{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.section{background:var(--card);border-radius:8px;padding:12px;border:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.device-icon{width:26px;height:26px;border-radius:6px;background:var(--panel);border:1px solid var(--border);
  flex:none;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.target-header .device-icon{width:30px;height:30px}

.devices-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.devices-head h3{margin:0}
.icon-btn{border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px;
  padding:2px 4px;line-height:1;border-radius:6px}
.icon-btn:hover{background:var(--panel);color:var(--text)}
.icon-btn:active{opacity:.6}
.device-row{display:flex;align-items:center;gap:9px;padding:9px 10px;font-size:13px;
  border-radius:6px;cursor:pointer;border-left:2px solid transparent}
.device-row:hover{background:rgba(255,255,255,.03)}
.device-row.selected{background:rgba(31,111,235,.12);border-left-color:var(--blue)}
.device-row .dot{flex:none}
.device-row .device-meta{flex:1;overflow:hidden}
.device-row .device-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;font-family:var(--font-mono);color:var(--text)}
.device-row .device-sub{font-size:10px;color:var(--sub);display:flex;align-items:center;gap:5px;
  font-family:var(--font-mono);margin-top:2px}
.device-row .chevron{flex:none;font-size:13px;opacity:.7}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.os-badge{font-size:9px;font-weight:500;color:var(--sub);background:var(--panel);
  border-radius:4px;padding:1px 4px;flex:none;font-family:var(--font-mono)}
.devices-count{font-size:10px;color:var(--sub);text-align:center;padding-top:4px;font-family:var(--font-mono)}
.target-header{display:flex;align-items:center;gap:10px}
.target-header .meta{flex:1;overflow:hidden}
.target-header .name{font-size:14px;font-weight:600;font-family:var(--font-mono)}
.target-header .sub{font-size:11px;color:var(--sub);font-family:var(--font-mono);margin-top:2px}
.busy-pill{margin-left:auto;flex:none;background:rgba(255,166,87,.12);color:var(--orange);
  font-size:10px;font-weight:500;font-family:var(--font-mono);padding:4px 8px;border-radius:5px;
  border:1px solid rgba(255,166,87,.3)}

.queue-head{display:flex;align-items:center;justify-content:space-between;
  font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;
  font-family:var(--font-sans);padding-bottom:8px;margin-bottom:2px;border-bottom:1px solid var(--border)}
.queue-head a{color:var(--blue);text-decoration:none;text-transform:none;letter-spacing:normal;font-size:11px;cursor:pointer}
.file-icon{width:20px;height:20px;flex:none;color:var(--sub);display:flex;align-items:center;justify-content:center}
.send-total{font-size:11px;color:var(--sub);font-family:var(--font-mono);white-space:nowrap}

#drop{
  border:2px dashed var(--border);border-radius:8px;padding:14px 16px;text-align:center;
  color:var(--sub);font-size:13px;transition:.15s;flex:1;display:flex;
  align-items:center;justify-content:center;min-height:120px;font-family:var(--font-sans)
}
#drop.over{border-color:var(--blue);background:rgba(31,111,235,.06)}
body.dragging{outline:3px dashed var(--blue);outline-offset:-3px}
.workspace-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.workspace-actions .btn{flex:1}
.workspace-actions #sendBtn{flex:none}

.tabs{display:flex;gap:4px;background:transparent;border-bottom:1px solid var(--border);padding:0}
.tab{flex:1;border:none;background:none;padding:10px 0;border-radius:0;font-size:11px;
  font-weight:500;color:var(--sub);cursor:pointer;font-family:var(--font-sans);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--blue)}
.tabpanel{flex:1;overflow-y:auto;min-height:0}
.tab-badge{display:inline-block;background:var(--blue);color:#fff;font-size:9px;font-weight:600;
  border-radius:8px;padding:1px 5px;margin-left:3px;font-family:var(--font-mono)}

.filerow .progress{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.filerow .progress-bar{height:100%;background:var(--blue);border-radius:2px;transition:width .15s}
.status-icon{flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.status-icon.spin{animation:spin 1s linear infinite;color:var(--blue)}
.status-icon.wait{color:var(--sub)}
.status-icon.ok{color:var(--green)}
.status-icon.fail{color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}

.filerow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filerow .progress{flex-basis:100%}
.filerow:last-child{border-bottom:none}
.filerow .meta{flex:1;overflow:hidden}
.filerow .name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono)}
.filerow .name a{color:var(--text);text-decoration:none}
.filerow .from{font-size:11px;color:var(--sub)}
.filerow .size{font-size:11px;color:var(--sub);flex:none;font-family:var(--font-mono)}
.filerow .right{display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:2px}
.filerow .time{font-size:10px;color:var(--sub);font-family:var(--font-mono)}
.filerow button{flex:none;border:none;background:none;color:var(--red);font-size:12px;cursor:pointer;padding:4px 6px}
.empty{color:var(--sub);font-size:12px;text-align:center;padding:16px 0}
.badge{width:20px;height:20px;border-radius:50%;flex:none;color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.badge.in{background:var(--green)}
.badge.out{background:var(--blue)}

/* Desktop/laptop: three columns filling the viewport, no page-level
   scroll - each column scrolls internally if its content overflows. */
@media (min-width:900px){
  body{height:100vh;overflow:hidden}
  .app{height:100vh}
  .panels{flex-direction:row;flex:1;min-height:0}
  .sidebar{width:280px;flex:none;border-bottom:none;border-right:1px solid var(--border);overflow-y:auto}
  .workspace{flex:1;min-width:0}
  .rightpanel{width:300px;flex:none;border-top:none;border-left:1px solid var(--border)}
}
/* Below the breakpoint, panels stack in normal document flow with no fixed
   height, so a flex:1 child (the drop zone) has nothing to grow against and
   collapses to its min-height - give the workspace column a real height so
   the drop zone actually fills the screen instead of a small box. */
@media (max-width:899px){
  .workspace{min-height:70vh}
}
</style></head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon">&#8599;</span>
      <h1>Share</h1><span class="tagline" id="versionTag"></span>
    </div>
    <div class="topbar-me"><span class="dot" id="topbarDot"></span><span id="topbarName"></span></div>
  </header>

  <div class="panels">

  <aside class="sidebar">
    <p class="tagline" style="margin-bottom:4px">Direct device-to-device. Nothing touches a server.</p>

    <div class="section">
      <h3>Your name</h3>
      <input type="text" id="myName" placeholder="e.g. Akhil's laptop" maxlength="30">
    </div>

    <div class="section">
      <div class="status"><span class="dot" id="dot"></span><span id="status">not connected</span></div>
    </div>

    <div class="section" id="createStep">
      <h3>Start a room</h3>
      <button class="btn btn-primary" onclick="createRoom()">Create room</button>
      <div id="codeBox" class="hidden">
        <div class="code" id="roomCode"></div>
        <div id="qrbox"></div>
        <label style="text-align:center">share the code, or scan the QR to join</label>
      </div>
    </div>

    <div class="section" id="joinStep">
      <h3>Join a room</h3>
      <div class="row">
        <input type="text" id="joinCode" placeholder="123456" maxlength="6" inputmode="numeric">
        <button class="btn btn-primary" onclick="joinRoom()">Connect</button>
      </div>
    </div>

    <div class="section" id="devicesCard">
      <div class="devices-head">
        <h3>Devices</h3>
        <button class="icon-btn" id="refreshDevices" title="Refresh">&#8635;</button>
      </div>
      <input type="text" id="deviceFilter" placeholder="Filter devices..." style="margin-bottom:8px">
      <div id="peerList"><div class="empty">none connected yet</div></div>
      <div class="devices-count" id="devicesCount"></div>
    </div>
  </aside>

  <main class="workspace">
    <div id="targetHeader" class="section target-header hidden">
      <span class="device-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
      <div class="meta">
        <div class="name" id="targetName"></div>
        <div class="sub" id="targetSub"></div>
      </div>
      <span class="busy-pill hidden" id="targetBusyPill">busy &mdash; may be slower</span>
    </div>
    <div id="drop">Drag files or folders anywhere on this page, or use + Add file/folder below</div>
    <input type="file" id="fileInput" multiple class="hidden">
    <div class="workspace-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">+ Add file/folder</button>
      <button class="btn btn-primary" id="sendBtn" disabled>Send files</button>
      <span class="send-total hidden" id="sendTotal"></span>
    </div>
  </main>

  <aside class="rightpanel">
    <div class="tabs">
      <button class="tab active" id="queueTab" onclick="switchTab('queue')">Queue <span class="tab-badge hidden" id="queueBadge"></span></button>
      <button class="tab" id="historyTab" onclick="switchTab('history')">History <span class="tab-badge hidden" id="historyBadge"></span></button>
    </div>
    <div id="queueList" class="tabpanel"><div class="empty">No files queued. Add files and hit Send.</div></div>
    <div id="historyList" class="tabpanel hidden"><div class="empty">nothing yet</div></div>
  </aside>

  </div>
</div>

<script>
const VERSION = 'v26';
document.getElementById('versionTag').textContent = '· ' + VERSION;

// A stuck old Service Worker from an earlier version of this page could
// still be intercepting requests and breaking things. That whole approach
// is gone now - proactively clear out any leftover registration.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

function detectOS() {
  const ua = navigator.userAgent;
  if (/Windows/.test(ua)) return 'WIN';
  if (/Mac/.test(ua)) return 'MAC';
  if (/Android/.test(ua)) return 'AND';
  if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
  if (/Linux/.test(ua)) return 'LNX';
  return '?';
}
const MY_OS = detectOS();

const ICON = {
  monitor: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
  file: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  spinner: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>',
  fail: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};

let peer;
const conns = new Map(); // conn.peer -> { conn, name, os, busy }
let selectedPeer = null; // peerId of the device files will be sent to
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
const nameInput = document.getElementById('myName');
nameInput.value = localStorage.getItem('shareName') || '';
nameInput.addEventListener('input', () => { localStorage.setItem('shareName', nameInput.value); renderTopbarMe(); });

function myName() { return nameInput.value.trim() || 'a device'; }
function setStatus(s, dotClass) {
  statusEl.textContent = s;
  dotEl.className = 'dot' + (dotClass ? ' ' + dotClass : '');
}
function renderTopbarMe() {
  document.getElementById('topbarName').textContent = myName();
  document.getElementById('topbarDot').className = 'dot live';
}
renderTopbarMe();

// A device row is click-to-select: exactly one connected device is the
// active send target at a time (matches the reference design), rather than
// broadcasting to everyone connected.
function renderPeerList() {
  const box = document.getElementById('peerList');
  const countEl = document.getElementById('devicesCount');
  if (selectedPeer && !conns.has(selectedPeer)) selectedPeer = null;
  if (!selectedPeer && conns.size) selectedPeer = [...conns.keys()][0];
  countEl.textContent = conns.size ? conns.size + ' connected' : '';
  if (!conns.size) { box.innerHTML = '<div class="empty">none connected yet</div>'; renderTargetHeader(); return; }
  const filter = document.getElementById('deviceFilter').value.trim().toLowerCase();
  const matches = [...conns.entries()].filter(([, { name }]) => name.toLowerCase().includes(filter));
  if (!matches.length) { box.innerHTML = '<div class="empty">no devices match</div>'; renderTargetHeader(); updateSendButton(); return; }
  box.innerHTML = '';
  for (const [peerId, { name, os, busy }] of matches) {
    const selected = peerId === selectedPeer;
    const row = document.createElement('div');
    row.className = 'device-row' + (selected ? ' selected' : '');
    row.innerHTML =
      `<span class="device-icon">${ICON.monitor}</span>` +
      `<div class="device-meta"><div class="device-name">${name}</div>` +
      `<div class="device-sub"><span class="os-badge">${os || '?'}</span>${busy ? 'busy' : 'connected'}</div></div>` +
      `<span class="dot ${busy ? 'busy' : 'live'}"></span>` +
      (selected ? '<span class="chevron">&#8250;</span>' : '');
    row.onclick = () => { selectedPeer = peerId; renderPeerList(); };
    box.appendChild(row);
  }
  renderTargetHeader();
  updateSendButton();
}
document.getElementById('deviceFilter').addEventListener('input', renderPeerList);
document.getElementById('refreshDevices').addEventListener('click', () => {
  for (const { conn, name } of conns.values()) {
    if (conn.open) conn.dataChannel.send(JSON.stringify({ type: 'hello', name: myName(), os: MY_OS }));
  }
  renderPeerList();
});

function renderTargetHeader() {
  const header = document.getElementById('targetHeader');
  const entry = selectedPeer && conns.get(selectedPeer);
  if (!entry) { header.classList.add('hidden'); return; }
  header.classList.remove('hidden');
  document.getElementById('targetName').textContent = entry.name;
  document.getElementById('targetSub').textContent = (entry.os || '?') + ' · ' + (entry.busy ? 'busy' : 'connected');
  document.getElementById('targetBusyPill').classList.toggle('hidden', !entry.busy);
}

const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function randomCode() { return String(Math.floor(100000 + Math.random() * 900000)); }

function createRoom() {
  const code = randomCode();
  setStatus('opening room ' + code + '...', 'pending');
  peer = new Peer(code, { config: ICE_CONFIG });
  peer.on('open', () => {
    document.getElementById('roomCode').textContent = code;
    document.getElementById('codeBox').classList.remove('hidden');
    const url = location.origin + location.pathname + '?code=' + code;
    document.getElementById('qrbox').innerHTML = '';
    new QRCode(document.getElementById('qrbox'), { text: url, width: 110, height: 110 });
    setStatus('waiting for devices to join...', 'pending');
    document.getElementById('joinStep').classList.add('hidden'); // already hosting - code stays visible so more can join
  });
  peer.on('connection', c => addConn(c));
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { createRoom(); return; }
    setStatus('error: ' + err.type, 'err');
    alert('Connection setup failed: ' + err.type);
  });
}

function joinRoom(codeOverride) {
  const code = codeOverride || document.getElementById('joinCode').value.trim();
  if (!/^\d{4,6}$/.test(code)) { alert('enter the 4-6 digit code'); return; }
  setStatus('connecting to room ' + code + '...', 'pending');
  peer = new Peer({ config: ICE_CONFIG });
  peer.on('open', () => {
    addConn(peer.connect(code, { reliable: true, metadata: { name: myName(), os: MY_OS } }));
    document.getElementById('createStep').classList.add('hidden');
    document.getElementById('joinStep').classList.add('hidden');
  });
  peer.on('connection', c => addConn(c));
  peer.on('error', err => {
    setStatus('error: ' + err.type, 'err');
    alert('Could not connect: ' + err.type + (err.type === 'peer-unavailable' ? ' — check the code' : ''));
  });
}

// PeerJS's default "binary" serialization silently corrupts ArrayBuffers
// sent through conn.send() (data arrives truncated to 0 bytes) - a library
// bug, reproduced directly against unpkg's build. PeerJS is used only to
// establish the connection (room codes, ICE/NAT traversal); all real
// traffic goes straight over the underlying RTCDataChannel, bypassing
// PeerJS's serializer entirely.
function addConn(conn) {
  const entry = { conn, name: (conn.metadata && conn.metadata.name) || 'a device', os: (conn.metadata && conn.metadata.os) || null };
  conns.set(conn.peer, entry);
  conn.on('open', () => {
    const dc = conn.dataChannel;
    dc.binaryType = 'arraybuffer';
    dc.send(JSON.stringify({ type: 'hello', name: myName(), os: MY_OS }));
    setStatus(conns.size + ' device' + (conns.size > 1 ? 's' : '') + ' connected', 'live');
    renderPeerList();

    // The browser fires 'message' events as packets arrive, without waiting
    // for a previous async handler call to finish - if handling one message
    // awaits something, later messages for the same file can be dispatched
    // and evaluated before conn._incoming is even set, and get silently
    // dropped. Chain them through one queue per connection so message N+1
    // never starts until message N is fully processed.
    let msgQueue = Promise.resolve();
    dc.onmessage = (e) => {
      msgQueue = msgQueue.then(async () => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'hello') {
            entry.name = msg.name;
            entry.os = msg.os;
            renderPeerList();
          } else if (msg.type === 'file-start') {
            entry.busy = true;
            renderPeerList();
            addPendingRow(msg.name, entry.name);
            conn._incoming = startIncoming(msg.name, msg.size, entry.name);
          } else if (msg.type === 'file-end' && conn._incoming) {
            await conn._incoming.finish();
            dc.send(JSON.stringify({ type: 'delivered', name: conn._incoming.name }));
            conn._incoming = null;
            entry.busy = false;
            renderPeerList();
          } else if (msg.type === 'delivered') {
            markDelivered(conn.peer, msg.name);
          }
        } else if (conn._incoming) {
          await conn._incoming.write(e.data);
        }
      });
    };
  });
  conn.on('close', () => {
    conns.delete(conn.peer);
    renderPeerList();
    setStatus(conns.size ? conns.size + ' device' + (conns.size > 1 ? 's' : '') + ' connected' : 'disconnected', conns.size ? 'live' : 'err');
  });
  conn.on('error', err => console.error('connection error', err));
}

// ---- receiving ----
//
// Earlier versions tried streaming straight to disk via the File System
// Access API (needs a live user gesture that never exists here - the file
// arrives async off the network) and then a Service Worker relay (fragile
// in practice: old SW versions get stuck controlling the page since
// browsers don't swap them in immediately, and GitHub Pages caches sw.js
// itself, both causing real, hard-to-diagnose failures). Buffering in
// memory has never failed in testing and needs none of that machinery.
// ponytail: whole file held in memory - fine up to ~1-2GB depending on
// the device; for reliably handling bigger files, self-host something
// like polius/FileSync instead.
function startIncoming(name, size, fromName) {
  const chunks = [];
  return {
    name,
    write: (chunk) => { chunks.push(chunk); },
    finish: async () => {
      const url = URL.createObjectURL(new Blob(chunks));
      // The History row's link only downloads when clicked - if nothing
      // ever gets clicked, the file exists in the tab but never reaches
      // disk. Trigger the save automatically the moment it's ready; the
      // row stays as a link too, for re-downloading later.
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      addReceivedRow(name, size, fromName, url);
    }
  };
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtTime() {
  return new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
}

// ---- tabs ----

function switchTab(which) {
  document.getElementById('queueTab').classList.toggle('active', which === 'queue');
  document.getElementById('historyTab').classList.toggle('active', which === 'history');
  document.getElementById('queueList').classList.toggle('hidden', which !== 'queue');
  document.getElementById('historyList').classList.toggle('hidden', which !== 'history');
}

// ---- history: received + sent activity ----

const pendingRows = new Map();

function addPendingRow(name, fromName) {
  const list = document.getElementById('historyList');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'filerow';
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<div class="name">${name}</div><div class="from">receiving from ${fromName}...</div>`;
  row.appendChild(meta);
  list.prepend(row);
  pendingRows.set(fromName + '|' + name, row);
  updateTabBadges();
}

function addReceivedRow(name, size, fromName, blobUrl) {
  const list = document.getElementById('historyList');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const pendingKey = fromName + '|' + name;
  const existing = pendingRows.get(pendingKey);
  pendingRows.delete(pendingKey);
  const row = existing || document.createElement('div');
  row.className = 'filerow';
  row.innerHTML = '';
  const badge = document.createElement('span');
  badge.className = 'badge in'; badge.textContent = '↓';
  row.appendChild(badge);
  const meta = document.createElement('div');
  meta.className = 'meta';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  if (blobUrl) {
    const a = document.createElement('a');
    a.href = blobUrl; a.download = name; a.textContent = name;
    nameEl.appendChild(a);
  } else {
    nameEl.textContent = name;
  }
  const fromEl = document.createElement('div');
  fromEl.className = 'from';
  fromEl.textContent = 'received from ' + fromName;
  meta.appendChild(nameEl); meta.appendChild(fromEl);
  row.appendChild(meta);
  const right = document.createElement('div');
  right.className = 'right';
  const sizeEl = document.createElement('span');
  sizeEl.className = 'size'; sizeEl.textContent = fmtSize(size);
  const timeEl = document.createElement('span');
  timeEl.className = 'time'; timeEl.textContent = fmtTime();
  right.appendChild(sizeEl); right.appendChild(timeEl);
  row.appendChild(right);
  const discard = document.createElement('button');
  discard.textContent = 'Discard';
  discard.onclick = () => { if (blobUrl) URL.revokeObjectURL(blobUrl); row.remove(); showHistoryEmptyIfNeeded(); updateTabBadges(); };
  row.appendChild(discard);
  if (!existing) list.prepend(row);
  updateTabBadges();
}

function showHistoryEmptyIfNeeded() {
  const list = document.getElementById('historyList');
  if (!list.children.length) list.innerHTML = '<div class="empty">nothing yet</div>';
}

const sentRows = new Map(); // peerId|name -> { row, statusEl, iconEl, barEl, toName }

// A row starts as "waiting" (clock icon, empty bar) the moment Send is
// clicked, before its turn in the sequential send loop - matches the
// reference design, where every queued item is visible immediately instead
// of appearing one at a time.
function addSentRow(peerId, name, size, toName) {
  const list = document.getElementById('historyList');
  if (list.querySelector('.empty')) list.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'filerow';
  row.innerHTML =
    `<span class="file-icon">${ICON.file}</span>` +
    `<div class="meta"><div class="name">${name}</div>` +
    `<div class="from">&rarr; ${toName} &middot; ${fmtSize(size)}</div></div>` +
    `<span class="status-icon wait">${ICON.clock}</span>` +
    `<div class="progress"><div class="progress-bar" style="width:0%"></div></div>`;
  list.prepend(row);
  const entry = {
    row, toName,
    statusEl: row.querySelector('.from'),
    iconEl: row.querySelector('.status-icon'),
    barEl: row.querySelector('.progress-bar'),
  };
  sentRows.set(peerId + '|' + name, entry);
  updateTabBadges();
  return entry;
}

function markSending(peerId, name) {
  const entry = sentRows.get(peerId + '|' + name);
  if (!entry) return;
  entry.iconEl.className = 'status-icon spin';
  entry.iconEl.innerHTML = ICON.spinner;
  entry.statusEl.textContent = 'sending to ' + entry.toName + '...';
}

function markProgress(peerId, name, fraction) {
  const entry = sentRows.get(peerId + '|' + name);
  if (entry) entry.barEl.style.width = Math.round(fraction * 100) + '%';
}

function markSent(peerId, name) {
  const entry = sentRows.get(peerId + '|' + name);
  if (!entry) return;
  entry.barEl.style.width = '100%';
  entry.iconEl.className = 'status-icon wait';
  entry.iconEl.innerHTML = ICON.clock;
  entry.statusEl.textContent = 'sent to ' + entry.toName + ', waiting for confirmation...';
}

function markDelivered(peerId, name) {
  const entry = sentRows.get(peerId + '|' + name);
  if (!entry) return;
  entry.row.querySelector('.progress').remove();
  entry.iconEl.className = 'status-icon ok';
  entry.iconEl.innerHTML = ICON.check;
  entry.statusEl.textContent = 'delivered to ' + entry.toName;
}

function markFailed(peerId, name, reason) {
  const entry = sentRows.get(peerId + '|' + name);
  if (!entry) return;
  entry.row.querySelector('.progress').remove();
  entry.iconEl.className = 'status-icon fail';
  entry.iconEl.innerHTML = ICON.fail;
  entry.statusEl.textContent = 'failed to send to ' + entry.toName + (reason ? ': ' + reason : '');
}

function updateTabBadges() {
  const queueBadge = document.getElementById('queueBadge');
  const historyBadge = document.getElementById('historyBadge');
  queueBadge.textContent = queue.length;
  queueBadge.classList.toggle('hidden', !queue.length);
  const historyCount = document.getElementById('historyList').querySelectorAll('.filerow').length;
  historyBadge.textContent = historyCount;
  historyBadge.classList.toggle('hidden', !historyCount);
}

// ---- queue: files staged before sending ----

let queue = []; // array of File (folders already zipped into one File each)

function renderQueue() {
  const list = document.getElementById('queueList');
  if (!queue.length) { list.innerHTML = '<div class="empty">No files queued. Add files and hit Send.</div>'; updateSendButton(); updateTabBadges(); return; }
  list.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'queue-head';
  head.innerHTML = `<span>${queue.length} file${queue.length > 1 ? 's' : ''} selected</span><a>Clear all</a>`;
  head.querySelector('a').onclick = () => { queue = []; renderQueue(); };
  list.appendChild(head);
  queue.forEach((file, i) => {
    const row = document.createElement('div');
    row.className = 'filerow';
    row.innerHTML =
      `<span class="file-icon">${ICON.file}</span>` +
      `<div class="meta"><div class="name">${file.name}</div>` +
      `<div class="from">${fmtSize(file.size)} &middot; ${file.type || 'application/octet-stream'}</div></div>`;
    const remove = document.createElement('button');
    remove.textContent = 'Remove';
    remove.onclick = () => { queue.splice(i, 1); renderQueue(); };
    row.appendChild(remove);
    list.appendChild(row);
  });
  updateSendButton();
  updateTabBadges();
}

function updateSendButton() {
  const target = selectedPeer && conns.get(selectedPeer);
  const btn = document.getElementById('sendBtn');
  const totalEl = document.getElementById('sendTotal');
  btn.disabled = !queue.length || !target || !target.conn.open;
  if (queue.length && target) {
    btn.textContent = `Send ${queue.length} file${queue.length > 1 ? 's' : ''} → ${target.name}`;
    totalEl.textContent = fmtSize(queue.reduce((n, f) => n + f.size, 0)) + ' total';
    totalEl.classList.remove('hidden');
  } else {
    btn.textContent = 'Send files';
    totalEl.classList.add('hidden');
  }
}

// ---- preparing dropped/picked items: folders get zipped into one file ----
//
// A browser can only ever trigger individual file downloads - there's no
// way for a webpage to write an actual folder to the receiver's disk in
// one action. Sending a folder's files individually means the receiver
// gets N separate downloads instead of "the folder". Zipping the folder
// into one file before sending is the only way to deliver it as a single
// download; the receiver extracts it locally to get the folder back.
async function zipFolder(folderName, files) {
  const zip = new JSZip();
  for (const f of files) {
    zip.file(f.webkitRelativePath.slice(folderName.length + 1), f);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  return new File([blob], folderName + '.zip');
}

async function prepareFiles(fileList) {
  const loose = [];
  const folders = new Map(); // top-level folder name -> its files
  for (const f of fileList) {
    const rel = f.webkitRelativePath;
    if (rel && rel.includes('/')) {
      const top = rel.split('/')[0];
      if (!folders.has(top)) folders.set(top, []);
      folders.get(top).push(f);
    } else {
      loose.push(f);
    }
  }
  const prepared = [...loose];
  for (const [folderName, files] of folders) {
    try {
      prepared.push(await zipFolder(folderName, files));
    } catch (err) {
      alert("Couldn't zip " + folderName + ': ' + err.message);
    }
  }
  return prepared;
}

async function addToQueue(fileList) {
  const prepared = await prepareFiles(fileList);
  queue.push(...prepared);
  renderQueue();
  switchTab('queue');
}

// ---- sending ----

const CHUNK = 16 * 1024;
// A folder's files carry their relative path in .webkitRelativePath - that
// path is used as the transferred "name" throughout, so the receiver
// naturally shows "MyFolder/photo.jpg" and Chrome recreates the subfolder
// under Downloads on save (a "/" in a download's suggested filename does
// that automatically - no directory-picker or extra protocol needed).
async function sendFileTo(conn, file, toName) {
  const dc = conn.dataChannel;
  const path = file.webkitRelativePath || file.name;
  markSending(conn.peer, path);
  dc.send(JSON.stringify({ type: 'file-start', name: path, size: file.size }));
  const reader = file.stream().getReader();
  let sent = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    for (let off = 0; off < value.byteLength; off += CHUNK) {
      const slice = value.slice(off, off + CHUNK).buffer;
      while (dc.bufferedAmount > 8 * 1024 * 1024) {
        await new Promise(r => setTimeout(r, 20));
      }
      dc.send(slice);
      sent += slice.byteLength;
      markProgress(conn.peer, path, file.size ? sent / file.size : 1);
    }
  }
  dc.send(JSON.stringify({ type: 'file-end' }));
  markSent(conn.peer, path);
}

document.getElementById('sendBtn').addEventListener('click', async () => {
  const target = selectedPeer && conns.get(selectedPeer);
  if (!target || !target.conn.open) { alert('pick a connected device to send to'); return; }
  if (!queue.length) return;
  const toSend = queue;
  queue = [];
  renderQueue();
  switchTab('history');
  // Every queued file gets a row immediately (clock icon, matching the
  // reference design) instead of appearing one at a time as its turn comes.
  for (const file of toSend) addSentRow(target.conn.peer, file.webkitRelativePath || file.name, file.size, target.name);
  target.busy = true;
  renderPeerList();
  for (const file of toSend) {
    const path = file.webkitRelativePath || file.name;
    try {
      await sendFileTo(target.conn, file, target.name);
    } catch (err) {
      markFailed(target.conn.peer, path, err.message);
    }
  }
  target.busy = false;
  renderPeerList();
});

// Plain drag-drop only gives top-level dropped items; a dropped folder's
// contents need walking its DataTransferItem entry tree explicitly.
// Hidden entries (dotfiles/dotfolders - .git, .DS_Store, etc.) are
// skipped: dragging a project folder should send the project, not its
// VCS internals.
function readEntry(entry, prefix) {
  return new Promise(resolve => {
    if (entry.name.startsWith('.')) { resolve([]); return; }
    if (entry.isFile) {
      entry.file(file => {
        try {
          Object.defineProperty(file, 'webkitRelativePath', { value: prefix + file.name });
        } catch (err) { /* ignore, falls back to plain file.name */ }
        resolve([file]);
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => reader.readEntries(async (batch) => {
        if (!batch.length) {
          const nested = await Promise.all(all.map(en => readEntry(en, prefix + entry.name + '/')));
          resolve(nested.flat());
        } else {
          all.push(...batch);
          readBatch();
        }
      });
      readBatch();
    } else {
      resolve([]);
    }
  });
}

async function filesFromDrop(dataTransfer) {
  const items = dataTransfer.items;
  if (!items || !items.length || !items[0].webkitGetAsEntry) return [...dataTransfer.files];
  const entries = [...items].map(i => i.webkitGetAsEntry()).filter(Boolean);
  const nested = await Promise.all(entries.map(e => readEntry(e, '')));
  return nested.flat();
}

// The drop target is the whole page, not just the box - without a
// document-level preventDefault, dropping anywhere outside that box falls
// through to the browser's own default action, which navigates the tab
// to show the raw file/folder instead of any of our JS ever running.
const drop = document.getElementById('drop');
let dragDepth = 0;
document.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  drop.classList.add('over');
  document.body.classList.add('dragging');
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) { drop.classList.remove('over'); document.body.classList.remove('dragging'); }
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove('over');
  document.body.classList.remove('dragging');
  try {
    const files = await filesFromDrop(e.dataTransfer);
    if (!files.length) { alert("Couldn't read anything from that drop - try again, or use + Add file/folder."); return; }
    addToQueue(files);
  } catch (err) {
    alert('Reading the dropped item failed: ' + err.message);
  }
});

document.getElementById('fileInput').addEventListener('change', e => {
  addToQueue([...e.target.files]);
  e.target.value = '';
});

// auto-join if opened from a QR code / shared link
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) {
  document.getElementById('joinCode').value = urlCode;
  joinRoom(urlCode);
}
</script>
</body></html>
